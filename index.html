<!DOCTYPE html>
<html lang="es">

<head>
    <script src="codexUsers.js"></script>
    <link id="favicon" rel="icon" type="image/svg+xml">
<meta charset="UTF-8">
<title>Eco-Códice</title>
<style>

:root{
    --aura:#888;
}

*{
    box-sizing:border-box;
}

body{

    margin:0;
    height:100vh;
  background:#000 url('./background.webp');
background-size: cover;
background-position: center;
background-attachment: fixed;
    color:white;

    font-family:"Courier New", monospace;

    overflow:hidden;

}


#screen{

    height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

}



#sigil{

    width:220px;
    height:220px;

}



.sigil-line {

    fill:none;

    stroke:var(--aura);

    stroke-width:2;

    stroke-dasharray:200;

    stroke-dashoffset:200;

    filter:
    drop-shadow(0 0 10px var(--aura));

}



.draw{

    animation:
    draw 2s forwards;

}



@keyframes draw{

    to{

        stroke-dashoffset:0;

    }

}



#sync{
    text-align:center;

    margin-top:20px;

    font-size:22px;

    opacity:0;

    transition:1s;

}



@keyframes fade{

    to{
        opacity:1;
    }

}



#diagnostics{

    width:420px;

    margin-top:30px;

}



.line{

    opacity:0;

    margin:10px 0;

    transition:.5s;

}



.show{

    opacity:1;

}



.ok{

    color:#6cff8d;

}



.warn{

    color:#ffd84d;

}



.fail{

    color:#ff4444;

}



#story{

    margin-top:30px;

    min-height:90px;

    text-align:center;

    font-size:22px;

}



#result{

    margin-top:25px;

    font-size:28px;

    text-align:center;

    opacity:0;

}



#flash{

    position:fixed;

    inset:0;

    background:var(--aura);

    opacity:0;

}



.flash{

    animation:flash .8s;

}



@keyframes flash{

    0%{
        opacity:0;
    }

    30%{
        opacity:.8;
    }

    100%{
        opacity:0;
    }

}

.sigil-rune {

    fill:var(--aura);

    opacity:0;

    filter:
    drop-shadow(0 0 10px var(--aura));

    animation:
    runeAppear 1s forwards;

}


.sigil-rune:nth-child(2){
    animation-delay:1s;
}


.sigil-rune:nth-child(3){
    animation-delay:1.3s;
}


.sigil-rune:nth-child(4){
    animation-delay:1.6s;
}


@keyframes runeAppear {

    from {

        opacity:0;

        transform:
        scale(0.5);

    }


    to {

        opacity:1;

        transform:
        scale(1);

    }

}


</style>

</head>



<body>


<div id="screen">


<svg id="sigil" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

    <polygon
      class="sigil-line"
      points="50,70 20,20 80,20"
    />


    <text 
      class="sigil-rune"
      x="10"
      y="20"
      text-anchor="middle"
      font-size="18">
      ᚱ
    </text>


    <text 
      class="sigil-rune"
      x="45"
      y="90"
      font-size="18">
      ᚺ
    </text>


    <text 
      class="sigil-rune"
      x="95"
      y="20"
      text-anchor="end"
      font-size="18">
      ᚨ
    </text>


</svg>



<div id="sync">

△<br>

Sincronizando...

</div>



<div id="diagnostics"></div>


<div id="story"></div>


<div id="result"></div>



</div>



<div id="flash"></div>






<script>


const sleep =
ms =>
new Promise(r=>setTimeout(r,ms));



//
// Obtener usuario de maingpage
//

const saved =
JSON.parse(
localStorage.getItem("ecoCodexState")
);



const userKey =
saved?.user ?? "unselected";



const user =
codexUsers[userKey] ?? codexUsers.unselected;



//
// Aura
//

let rgbHue=0;



function updateAura(){


    if(user.rgb){


        setInterval(()=>{


            rgbHue =
            (rgbHue+2)%360;


            const color =
            `hsl(${rgbHue},100%,60%)`;



            document.documentElement
            .style
            .setProperty(
                "--aura",
                color
            );



        },30);



    }

    else{


        document.documentElement
        .style
        .setProperty(
            "--aura",
            user.color
        );


    }


}



updateAura();




function typeText(element,text,speed=50){

    return new Promise(resolve=>{

        let i=0;

        element.innerHTML="";


        let timer=setInterval(()=>{

            element.innerHTML=text.substring(0,i).replaceAll("\n","<br>");

            i++;


            if(i>text.length){

                clearInterval(timer);
                resolve();

            }

        },speed);


    });

}





async function start(){



await sleep(500);




// Sigilo

document
.querySelectorAll(".sigil-line")
.forEach(
x=>x.classList.add("draw")
);



await sleep(1200);

document.getElementById("sync").style.opacity = 1;

await sleep(800);


// Diagnóstico


let diagnostics=[


[
"[✓] Integridad del Eco-Códice",
"ok"
],


[
"[✓] Marca encontrada",
"ok"
],


[
"[✓] Canal del Reverso abierto",
"ok"
],


[
"[...] Analizando memoria residual",
"warn"
]

];




if(userKey==="codex"){


diagnostics.push(
[
"[!] Anomalía detectada",
"warn"
]
);


}

else if(userKey==="unselected"){


diagnostics.push(
[
"[✗] Portador desconocido",
"fail"
]
);


}

else{


diagnostics.push(
[
"[✓] Identidad confirmada",
"ok"
]
);


}




const box =
document.getElementById("diagnostics");



for(let d of diagnostics){


let div =
document.createElement("div");


div.className=
"line "+d[1];


div.textContent=d[0];


box.appendChild(div);



await sleep(500);


div.classList.add("show");



await sleep(300);


}





// Narrativa


const story =
document.getElementById("story");



await typeText(
story,
"La Marca recuerda."
);



await sleep(600);



await typeText(
story,
"El Eco escucha."
);



await sleep(600);



await typeText(
story,
"La Verdad espera."
);



await sleep(1000);




// Vinculación

const result =
document.getElementById("result");


result.style.opacity = 1;


if(userKey==="unselected" || userKey==="codex"){

    await typeText(
        result,
        "Portador desconocido.",
        70
    );

}

else{

    result.innerHTML="";

await typeText(
    result,
    `Eco-Códice vinculado.

Bienvenido, ${user.name}.`,
    70
);
}



result.style.opacity=1;



await sleep(1500);




// Flash


document
.getElementById("flash")
.classList.add("flash");



// Entrada
await sleep(200);

window.location.href=
"mainpage.html";



}



start();


</script>


</body>
</html>
