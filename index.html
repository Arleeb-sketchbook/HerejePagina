<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Eco-Códice</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: black;
    color: white;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

#screen {
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    opacity: 1;
    transition: opacity 1s;
}

#sigil {
    width: 200px;
    height: 200px;
    margin-bottom: 20px;
}

.sigil-line {
    fill: none;
    stroke: var(--aura);
    stroke-width: 3;
    stroke-dasharray: 500;
    stroke-dashoffset: 500;
    filter: drop-shadow(0 0 10px var(--aura));
}

.draw {
    animation: draw 2s forwards;
}

@keyframes draw {
    to {
        stroke-dashoffset: 0;
    }
}

#sync {
    font-size: 20px;
    opacity: 0;
    animation: fadeIn 1s forwards;
}

@keyframes fadeIn {
    to {
        opacity: 1;
    }
}

#diagnostics {
    width: 400px;
    margin-top: 30px;
}

.line {
    opacity: 0;
    margin: 10px 0;
    transition: .5s;
}

.show {
    opacity: 1;
}

.ok {
    color: #6cff8d;
}

.warn {
    color: orange;
}

.fail {
    color: red;
}

#story {
    margin-top: 30px;
    font-size: 22px;
    min-height: 90px;
    text-align: center;
}

#result {
    margin-top: 20px;
    font-size: 26px;
    text-align: center;
    opacity: 0;
}

#flash {
    position: fixed;
    inset: 0;
    background: var(--aura);
    opacity: 0;
    pointer-events: none;
}

.flash {
    animation: flash .8s;
}

@keyframes flash {
    0% {
        opacity:0;
    }
    30% {
        opacity:.8;
    }
    100% {
        opacity:0;
    }
}

#interface {
    display:none;
    font-size:40px;
}
</style>
</head>

<body>

<div id="screen">

    <svg id="sigil" viewBox="0 0 200 200">

        <polygon class="sigil-line"
        points="
        100,10
        190,170
        10,170
        100,10"/>

        <circle class="sigil-line"
        cx="100"
        cy="110"
        r="50"/>

        <line class="sigil-line"
        x1="100"
        y1="60"
        x2="100"
        y2="160"/>

    </svg>


    <div id="sync">
        △<br>
        Sincronizando...
    </div>


    <div id="diagnostics">

    </div>


    <div id="story"></div>


    <div id="result"></div>

</div>


<div id="flash"></div>

<div id="interface">
    INTERFAZ DEL ECO-CÓDICE
</div>


<script>

//
// Cambiar estos valores
//
const carrier = "RGB";
// Opciones:
// "Akatsuki"
// "Clementine"
// "???"
// "RGB"


const auraColors = {
    Akatsuki:"#ff3333",
    Clementine:"#9d6cff",
    RGB:"#00ffff",
    "???":"#ffffff"
};


document.documentElement.style.setProperty(
    "--aura",
    auraColors[carrier] || "#ffffff"
);



const sleep = ms =>
    new Promise(resolve=>setTimeout(resolve,ms));



function typeText(element,text,speed=50){

    return new Promise(resolve=>{

        let i=0;

        element.innerHTML="";

        let timer=setInterval(()=>{

            element.innerHTML += text[i];

            i++;

            if(i>=text.length){
                clearInterval(timer);
                resolve();
            }

        },speed);

    });

}



async function start(){


    // Oscuridad total
    await sleep(500);



    // Dibujar sigilo

    document.querySelectorAll(".sigil-line")
    .forEach(x=>x.classList.add("draw"));

    await sleep(1000);



    // Diagnósticos

    const diagnostics=[

        ["[✓] Integridad del Eco-Códice","ok"],
        ["[✓] Marca encontrada","ok"],
        ["[✓] Canal del Reverso abierto","ok"],
        ["[...] Analizando memoria residual","warn"]

    ];


    if(carrier==="???"){

        diagnostics.push(
            ["[✗] Portador desconocido","fail"]
        );

    }
    else if(carrier==="RGB"){

        diagnostics.push(
            ["[!] Anomalía detectada","warn"]
        );

    }
    else{

        diagnostics.push(
            ["[✓] Identidad confirmada","ok"]
        );

    }



    let box=document.getElementById("diagnostics");


    for(let d of diagnostics){

        let div=document.createElement("div");

        div.className="line "+d[1];

        div.innerHTML=d[0];

        box.appendChild(div);

        await sleep(600);

        div.classList.add("show");

        await sleep(300);

    }



    await sleep(500);



    // Narrativa

    let story=document.getElementById("story");


    await typeText(
        story,
        "La Marca recuerda."
    );

    await sleep(500);


    await typeText(
        story,
        "El Eco escucha."
    );

    await sleep(500);


    await typeText(
        story,
        "La Verdad espera."
    );



    await sleep(1000);



    // Resultado final

    let result=document.getElementById("result");


    if(carrier==="???"){

        result.innerHTML=
        "Portador desconocido.";

    }
    else{

        result.innerHTML=
        `Eco-Códice vinculado.<br><br>
        Bienvenido,<br>
        ${carrier}.`;

    }


    result.style.opacity=1;


    await sleep(1500);



    // Flash

    let flash=document.getElementById("flash");

    flash.classList.add("flash");



    await sleep(800);



window.location.href = "mainpage.html";


}



start();


</script>

</body>
</html>
